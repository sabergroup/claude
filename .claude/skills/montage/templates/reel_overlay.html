<script>
const D=DATA, FPS=25, pre=3/FPS;

DEV.forEach(dv=>{

});

// ---------- name intro: gold point -> line -> two dividers; DR. / MARWA / MAGDY revealed by masks; title under it ----------

  const e=$(ids.tt), m=cl(spr(t-(Tm.title-pre),.4),0,1)*(1-spx(t-(Tm.exit-.1),.26)), w=e.getBoundingClientRect().width;

  const ins=(50*(1-m)).toFixed(2); e.style.clipPath=`inset(-8px ${ins}% -8px ${ins}%)`; e.style.visibility=m<=0.001?'hidden':'visible';
}
// ---------- seek ----------
function seek(t){
  if(!WD){ WD={}; if(SP){ [['g1',G1],['g2',G2],['c1',C1],['c2',C2],['tt',TT]].forEach(([k,g])=>WD[k]=g.getBoundingClientRect().width);
    place(C1,rowText(540,WD.c1),0); place(C2,rowText(540,WD.c2),0); place(TT,rowText(540,WD.tt),0); place(CH,540,92); } NG=nameGeo(); }
  const ly=lap(t); Lc.style.transform=`translateY(${ly.toFixed(2)}px)`;
  // captions
  const inIns=D.insert? (t>D.insert.start+0.45 && t<D.insert.end):false;
  blocks.forEach(B=>{ const vis=!inIns && t>B.start-0.02 && t<B.leave+0.4; B.el.style.visibility=vis?'visible':'hidden'; if(!vis) return;
    const xo=spx(t-B.leave,.2);
    B.c.forEach(o=>{ const a=spr(t-o.ta,.30); o.el.style.transform=`translateY(${((1-a)*135-xo*135).toFixed(1)}px)`; o.el.style.opacity=(a>0.001&&xo<.999)?1:0; }); });
  splitSeek(t); devSeek(t);
  // name intro sits under a two-row caption block (block bottom ~ +150)
  nameSeek(t,{dot:'ndot',path:'np',w:'n',tt:'ntt'},NM,300,150,{});
  // cream flash on Saber's cuts (no frame blending)
  let f=0, col='#F6EAD6', sw=null, ln=null; D.trans.forEach(([c,k])=>{ const d=t-c; if(d<0||d>.6) return;
    if(k=='flash'){ f=.30*Math.exp(-d*14); col='#F6EAD6'; } else if(k=='line'){ ln=d; } else { sw=d; } });
  const fe=$('flash'); fe.style.background=col; fe.style.opacity=f.toFixed(3);
  const se=$('sweep'); if(sw!==null && sw<.45){ const p=sw/.45, x=-700+p*2500; se.style.visibility='visible'; se.style.transform=`translateX(${x.toFixed(0)}px) rotate(18deg)`; se.style.opacity=(.22*(1-p)).toFixed(3); } else se.style.visibility='hidden';
  const le=$('gline'); if(ln!==null && ln<.4){ const p=ln/.4, y=-20+p*1960; le.style.visibility='visible'; le.style.transform=`translateY(${y.toFixed(0)}px)`; le.style.opacity=(1-p*p).toFixed(3); } else le.style.visibility='hidden';
  // ending: gold ring closes on her, the world turns brown, the point becomes the dividers of the end card
  const E=D.END, cx=540, cy=760;
  const R=1500*(1-spx(t-E.start,.80));
  const vis=t>E.start-0.01; $('end').style.visibility=vis?'visible':'hidden';
  if(vis){ const r=Math.max(0,R);
    $('mask').setAttribute('d',`M0 0 H1080 V1920 H0Z M${cx} ${cy-r} a${r} ${r} 0 1 0 0.01 0Z`);
    $('ering').setAttribute('cx',cx); $('ering').setAttribute('cy',cy); $('ering').setAttribute('r',r.toFixed(1)); $('ering').style.opacity=r>2?1:0;
    const dr=4.5*spr(t-(E.close-0.06),.18)*(1-spx(t-(E.close+0.30),.25));
    $('edot').setAttribute('cx',cx); $('edot').setAttribute('cy',cy); $('edot').setAttribute('r',Math.max(0,dr).toFixed(2));
    ['e0','e1','e2','ett'].forEach(i=>$(i).style.visibility='hidden'); }
}
window.seek=seek;
// audit: how long each word stays readable (captions + devices)
window.audit=()=>{ const out=[]; blocks.forEach(B=>B.c.forEach(o=>out.push(['cap',o.w,+(B.leave-o.ta).toFixed(2),+o.ta.toFixed(2)])));
  (D.devices||[]).forEach(d=>{ const ws=[]; const walk=x=>{ if(Array.isArray(x)) x.forEach(walk); else if(x&&typeof x=='object'){ if('w' in x) ws.push(x); else Object.values(x).forEach(walk);} }; walk(d.items||d.sections);
    if(d.type=='cmp') d.sections.forEach((s,si)=>{ const nx=si+1<d.sections.length?d.sections[si+1].head[0].t:d.end; const w2=[]; const wk=x=>{ if(Array.isArray(x)) x.forEach(wk); else if(x&&'w' in x) w2.push(x); else if(x) Object.values(x).forEach(wk);}; wk(s); w2.forEach(o=>out.push([d.type,o.w,+(nx-(o.t-pre)).toFixed(2),+o.t.toFixed(2)])); });
    else if(d.type=='num'){ d.items.forEach((it,i)=>{ const nx=i+1<d.items.length?d.items[i+1].t:d.end; it.words.forEach(o=>out.push([d.type,o.w,+(nx-(o.t-pre)).toFixed(2),+o.t.toFixed(2)])); }); (d.title||[]).forEach(o=>out.push([d.type,o.w,+(d.end-(o.t-pre)).toFixed(2),+o.t.toFixed(2)])); }
    else if(d.type=='counter') d.items.forEach((it,i)=>{ const nx=i+1<d.items.length?d.items[i+1].t:d.end; it.words.forEach(o=>out.push([d.type,o.w,+(nx-(o.t-pre)).toFixed(2),+o.t.toFixed(2)])); });
    else ws.forEach(o=>out.push([d.type,o.w,+(d.end-(o.t-pre)).toFixed(2),+o.t.toFixed(2)])); });
  if(SP){ ['c1','c2','title','chips'].forEach(k=>SP[k].forEach(o=>out.push(['split',o.w,+((k=='c1'||k=='c2'?SP.merge:SP.end)-(o.t-pre)).toFixed(2),+o.t.toFixed(2)])));
    SP.cap.forEach((r,ri)=>r.forEach(o=>out.push(['split',o.w,+((ri==0?SP.cap[1][0].t:SP.tt)-(o.t-pre)).toFixed(2),+o.t.toFixed(2)]))); }
  return out; };
