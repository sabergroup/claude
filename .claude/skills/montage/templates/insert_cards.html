<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A5;src:url(../fonts/Alexandria500.ttf)}
@font-face{font-family:A8;src:url(../fonts/Alexandria800.ttf)}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
#ins{position:absolute;inset:0;background:#2E1A0D;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#grid{position:absolute;left:-1500px;top:-1500px;width:4080px;height:4920px;background-image:radial-gradient(circle,rgba(246,234,214,.10) 2px,transparent 2.5px);background-size:44px 44px}
.card{position:absolute;background:rgb(74,42,20);border:2px solid rgba(240,201,138,.45);border-radius:34px;transform-origin:50% 0;box-shadow:0 14px 30px rgba(20,10,4,.45)}
.num{position:absolute;top:24px;right:24px;width:70px;height:70px;border:3px solid #F0C98A;border-radius:50%;font:38px/70px A8;color:#F0C98A;text-align:center}
.ttl{position:absolute;left:24px;right:24px;text-align:center;font:52px/1.3 A8;color:#F6EAD6;direction:rtl;white-space:nowrap}
.ttl.g{color:#F0C98A}
.sub{position:absolute;left:24px;right:24px;text-align:center;font:38px/1.3 A5;color:#F6EAD6;opacity:.92;direction:rtl;white-space:nowrap}
.chip{position:absolute;height:84px;border:3px solid #F0C98A;border-radius:42px;background:#3A2112;overflow:hidden;direction:rtl}
.chip span{position:absolute;right:0;top:0;height:84px;font:40px/80px A5;color:#F6EAD6;white-space:nowrap;padding:0 30px}
svg.top{position:absolute;left:0;top:0;overflow:visible}
#ball{position:absolute;left:0;top:0;border-radius:50%;background:#F6EAD6;box-shadow:0 6px 14px rgba(20,10,4,.5)}
</style></head><body><div id="st"><div id="ins"><div id="world"><div id="grid"></div><svg class="top" id="wsvg" width="1080" height="1920"></svg></div><div id="ball"></div></div></div>
<script>
const D=DATA, pre=3/25;
function spr(t,Ts){ if(t<=0) return 0; const z=0.82,w=4/(z*Ts),wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
function spx(t,Ts){ if(t<=0) return 0; const w=5.8/Ts; return 1-(1+w*t)*Math.exp(-w*t); }
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), $=id=>document.getElementById(id), W=$('world'), SV=$('wsvg');
const NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||SV).appendChild(e); return e; }
// cards
D.cards.forEach(c=>{ const e=document.createElement('div'); e.className='card'; Object.assign(e.style,{left:c.x+'px',top:c.y+'px',width:c.w+'px',height:c.h+'px'}); W.insertBefore(e,SV); c.el=e;
  if(c.num){ const n=document.createElement('div'); n.className='num'; n.textContent=c.num; e.appendChild(n); }
  c.lines=(c.titles||[]).map(L=>{ const d=document.createElement('div'); d.className='ttl'+(L.g?' g':''); d.style.top=L.y+'px'; if(L.size) d.style.fontSize=L.size+'px'; d.textContent=L.text; e.appendChild(d); return d; });
  c.subs=(c.subs||[]).map(L=>{ const d=document.createElement('div'); d.className='sub'; d.style.top=L.y+'px'; d.textContent=L.text; e.appendChild(d); L.el=d; return L; });
  c.chipEls=(c.chips||[]).map(ch=>{ const d=document.createElement('div'); d.className='chip'; d.style.top=ch.y+'px'; const s=document.createElement('span'); s.textContent=ch.text; d.appendChild(s); e.appendChild(d); ch.el=d; ch.sp=s; return ch; });
});
// extra world drawings: timeline lines, X marks, arrows (gold line icons, one stroke width)
(D.marks||[]).forEach(m=>{ m.el=svgEl('path',{d:m.d,fill:'none',stroke:'#F0C98A','stroke-width':m.sw||4,'stroke-linecap':'round','stroke-linejoin':'round'}); m.len=m.el.getTotalLength(); });
function cam(t){ const C=D.cam; let x=C[0][1],y=C[0][2],lz=Math.log(C[0][3]);
  for(let i=1;i<C.length;i++){ const s=spr(t-C[i][0],C[i][4]||.6); x+=(C[i][1]-C[i-1][1])*s; y+=(C[i][2]-C[i-1][2])*s; lz+=(Math.log(C[i][3])-Math.log(C[i-1][3]))*s; } return {x,y,z:Math.exp(lz)}; }
const toS=(c,p)=>({x:(p.x-c.x)*c.z+540,y:(p.y-c.y)*c.z+960});
const pos=(wp,c)=>wp.s?wp.s:toS(c,wp.w);
function seek(t){
  const c=cam(t); W.style.transform=`translate(${540-c.x*c.z}px,${960-c.y*c.z}px) scale(${c.z})`;
  // ball route: lands on each waypoint at its word
  const R=D.ball; let bx,by,sq=0; const rad=17*Math.min(c.z,1.4);
  let k=0; while(k<R.length-1 && t>R[k+1][0]) k++;
  if(k>=R.length-1){ const p=pos(R[R.length-1][1],c); bx=p.x; by=p.y; }
  else { const [ta,A]=R[k],[tb,B]=R[k+1]; const lead=Math.min(.55,Math.max(.22,(tb-ta)*.55)), t0=Math.max(ta,tb-lead), u=cl((t-t0)/(tb-t0),0,1);
    const e=(1-Math.cos(Math.PI*u))/2, pa=pos(A,c), pb=pos(B,c), hop=Math.min(240,Math.hypot(pb.x-pa.x,pb.y-pa.y)*.35);
    bx=pa.x+(pb.x-pa.x)*e; by=pa.y+(pb.y-pa.y)*e-hop*Math.sin(Math.PI*u); }
  for(let i=1;i<R.length-1;i++){ const d=t-R[i][0]; if(d>=0&&d<.4) sq+=Math.exp(-d*14)*Math.sin(d*28)*.5; }
  sq=cl(sq,-.3,.35); const B=$('ball'); B.style.width=B.style.height=(2*rad)+'px';
  B.style.transform=`translate(${bx-rad}px,${by-rad}px) scale(${1+sq*.6},${1-sq})`;
  const Rr=2400*spr(t-D.open,.55)*(1-spx(t-D.close,.45));   // closes without overshoot, never reopens
  $('ins').style.clipPath=`circle(${Math.max(0,Rr).toFixed(1)}px at ${bx.toFixed(1)}px ${by.toFixed(1)}px)`;
  B.style.visibility=(t<D.open-.12||t>D.close+.55)?'hidden':'visible'; $('ins').style.visibility=(t<D.open-.05||t>D.close+.6)?'hidden':'visible';
  D.cards.forEach(cd=>{ const s=spr(t-(cd.t-pre),.38); cd.el.style.transform=`translateY(${(1-s)*60}px) scale(${.9+.1*s})`; cd.el.style.opacity=cl(s*1.8,0,1);
    (cd.titles||[]).forEach((L,i)=>{ const s=cl(spr(t-(L.t-pre),.35),0,1); cd.lines[i].style.clipPath=`inset(0 0 0 ${(100*(1-s)).toFixed(1)}%)`; });
    cd.subs.forEach(L=>{ const s=cl(spr(t-(L.t-pre),.35),0,1); L.el.style.clipPath=`inset(0 0 0 ${(100*(1-s)).toFixed(1)}%)`; });
    cd.chipEls.forEach(ch=>{ if(ch.w===undefined){ ch.w=ch.sp.offsetWidth; }
      const s=spr(t-(ch.t-pre),.32), ww=Math.max(0,ch.w*s); const right=(ch.cx!==undefined?ch.cx:cd.w/2)+ch.w/2; ch.el.style.width=ww+'px'; ch.el.style.left=(right-ww)+'px'; ch.el.style.opacity=t<ch.t-pre?0:1; }); });
  (D.marks||[]).forEach(m=>{ const s=cl(spr(t-(m.t-pre),m.ts||.4),0,1); m.el.setAttribute('stroke-dasharray',`${(m.len*s).toFixed(1)} ${m.len+1}`); m.el.style.opacity=s>0.002?1:0; });
}
window.seek=seek;
</script></body></html>
