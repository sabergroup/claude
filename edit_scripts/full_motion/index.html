<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A5;src:url(../fonts/Alexandria500.ttf)}
@font-face{font-family:A8;src:url(../fonts/Alexandria800.ttf)}
@font-face{font-family:MM;src:url(../fonts/MontserratM.ttf)}
@font-face{font-family:MS;src:url(../fonts/MontserratSB.ttf)}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
#L{position:absolute;left:0;top:0;width:1080px;height:1920px}
.blk{position:absolute;left:0;top:0;width:1080px}
.row{display:flex;justify-content:center;direction:rtl;gap:16px;margin-top:-36px}
.row:first-child{margin-top:0}
.grp{position:absolute;display:flex;justify-content:center;direction:rtl;gap:14px;white-space:nowrap}
.m{overflow:hidden;padding:12px 6px 28px;display:inline-block}
.w{display:inline-block;font:54px/1.25 A5;color:#F6EAD6;text-shadow:0 3px 10px rgba(74,42,20,.65),0 1px 2px rgba(74,42,20,.5)}
.w.g{font-family:A8;color:#F0C98A}
.w.chip{font-size:46px}
.badge{position:absolute;width:84px;height:84px;overflow:hidden}
.d{position:absolute;left:0;top:0;width:84px;font:46px/84px A8;color:#F0C98A;text-align:center;text-shadow:0 3px 10px rgba(74,42,20,.6)}
.nw{position:absolute;font:36px/50px MS;color:#F6EAD6;white-space:nowrap;text-shadow:0 2px 8px rgba(74,42,20,.65)}
.tt{position:absolute;font:26px/40px MM;color:#F6EAD6;letter-spacing:.12em;white-space:nowrap;text-shadow:0 2px 8px rgba(74,42,20,.65)}
svg{position:absolute;left:0;top:0;overflow:visible}
#Lsvg{filter:drop-shadow(0 2px 4px rgba(74,42,20,.55))}
#flash{position:absolute;inset:0;background:#F6EAD6;opacity:0}
#end{position:absolute;inset:0}
</style></head><body><div id="st">
<div id="flash"></div>
<div id="L">
 <svg id="Lsvg" width="1080" height="1920"><path id="np" fill="none" stroke="#F0C98A" stroke-width="2.5" stroke-linecap="round"/><circle id="ndot" fill="#F0C98A" r="0"/>
  <circle id="r1" fill="none" stroke="#F0C98A" stroke-width="3" r="40"/><circle id="r2" fill="none" stroke="#F0C98A" stroke-width="3" r="40"/>
  <path id="u1" stroke="#F0C98A" stroke-width="3" stroke-linecap="round"/><path id="u2" stroke="#F0C98A" stroke-width="3" stroke-linecap="round"/></svg>
 <div class="nw" id="n0" style="font-family:MM">DR.</div><div class="nw" id="n1">MARWA</div><div class="nw" id="n2">MAGDY</div>
 <div class="tt" id="ntt">Aesthetic Dermatologist</div>
 <div class="badge" id="b1"><div class="d" id="d1">١</div><div class="d" id="d3">٣</div></div><div class="badge" id="b2"><div class="d" id="d2">٢</div></div>
</div>
<div id="end"><svg width="1080" height="1920"><path id="mask" fill="#2E1A0D" fill-rule="evenodd"/><circle id="ering" fill="none" stroke="#F0C98A" stroke-width="3"/>
 <path id="ep" fill="none" stroke="#F0C98A" stroke-width="2.5" stroke-linecap="round"/><circle id="edot" fill="#F0C98A" r="0"/></svg>
 <div class="nw" id="e0" style="font-family:MM">DR.</div><div class="nw" id="e1">MARWA</div><div class="nw" id="e2">MAGDY</div>
 <div class="tt" id="ett">Aesthetic Dermatologist</div></div>
</div>
<script>
const D=DATA, FPS=25, pre=3/FPS;
function spr(t,Ts){ if(t<=0) return 0; const z=0.82,w=4/(z*Ts),wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), $=id=>document.getElementById(id);
const Lc=$('L');
// ---------- shot-aware anchor: top of her lap in each shot (springs at every cut) ----------
function lap(t){ let y=D.lap[0]; for(let i=0;i<D.cuts.length;i++) y+=(D.lap[i+1]-D.lap[i])*spr(t-D.cuts[i],.22); return y; }
// ---------- caption blocks (two rows, word by word, each block stays until the next one starts) ----------
const blocks=[];
D.chunks.forEach((c,ci)=>{ const B=document.createElement('div'); B.className='blk'; const rows=[];
  c.forEach(o=>{ if(!rows[o.r]){ rows[o.r]=document.createElement('div'); rows[o.r].className='row'; B.appendChild(rows[o.r]); }
    const m=document.createElement('span'); m.className='m'; const s=document.createElement('span'); s.className='w'+(o.g?' g':'');
    s.textContent=o.w; m.appendChild(s); rows[o.r].appendChild(m); o.el=s; });
  Lc.appendChild(B);
  const nxt=ci+1<D.chunks.length?D.chunks[ci+1][0].t:1e9;
  const brk=(c[0].t<D.split.start && nxt>D.split.start)?D.split.start:nxt;   // the split section takes over
  blocks.push({el:B,c,start:c[0].t,leave:Math.min(brk, c[c.length-1].e+1.6, D.END.start)}); });
// ---------- split section ----------
const SP=D.split;
function grp(words,cls){ const g=document.createElement('div'); g.className='grp'; words.forEach(o=>{ const m=document.createElement('span'); m.className='m';
  const s=document.createElement('span'); s.className='w'+(o.g?' g':'')+(cls?' '+cls:''); s.textContent=o.w; m.appendChild(s); g.appendChild(m); o.el=s; }); Lc.appendChild(g); return g; }
const G1=grp(SP.c1),G2=grp(SP.c2),C1=grp(SP.cap[0]),C2=grp(SP.cap[1]),TT=grp(SP.title),CH=grp(SP.chips,'chip');
const place=(g,cx,top)=>{ const w=g.getBoundingClientRect().width; g.style.left=(cx-w/2)+'px'; g.style.top=top+'px'; };
const RW=98, rowRing=(c,tw)=>c+(tw+RW)/2-42, rowText=(c,tw)=>c-(tw+RW)/2+tw/2;
let WD=null;
function wordAnim(o,tin,tout,dir){ const a=spr(tin,.32), x=tout; o.el.style.transform=`translateY(${((1-a)*135+dir*x*135).toFixed(1)}px)`; o.el.style.opacity=(a>0.001&&x<.999)?1:0; }
function splitSeek(t){
  const on=t>SP.start-0.3 && t<SP.end+0.6; [G1,G2,C1,C2,TT,CH].forEach(g=>g.style.visibility=on?'visible':'hidden');
  ['r1','r2','u1','u2'].forEach(i=>$(i).style.visibility=on?'visible':'hidden'); ['b1','b2'].forEach(i=>$(i).style.visibility=on?'visible':'hidden');
  if(!on) return;
  const F1=SP.f1,F2=SP.f2,M=SP.merge,TTt=SP.tt,C2t=SP.cap[1][0].t, ex=spr(t-(SP.end-pre-.05),.2);
  const mg=spr(t-(M-pre),.42), mg2=spr(t-(M-pre-.05),.48), sB=spr(t-(C2t-pre),.3), sC=spr(t-(TTt-pre),.34);
  const rA=rowRing(540,WD.c1), rB=rowRing(540,WD.c2), rC=rowRing(540,WD.tt), r1s=rowRing(800,WD.g1), r2s=rowRing(280,WD.g2);
  const x1=r1s+(rA-r1s)*mg2+(rB-rA)*sB+(rC-rB)*sC, x2=r2s+(rA-r2s)*mg+(rB-rA)*sB+(rC-rB)*sC, Y=46;
  const dr=(el,x,tt)=>{ const s=cl(spr(t-(tt-pre),.34),0,1)*(1-ex); el.setAttribute('cx',x); el.setAttribute('cy',Y);
    const L=2*Math.PI*40; el.setAttribute('stroke-dasharray',`${(L*s).toFixed(1)} ${L}`); el.setAttribute('transform',`rotate(-90 ${x} ${Y})`); el.style.opacity=s>0.002?1:0; };
  dr($('r1'),x1,F1); dr($('r2'),x2,F2); if(mg>0.995) $('r2').style.opacity=0;
  $('b1').style.left=(x1-42)+'px'; $('b1').style.top=(Y-42)+'px'; $('b2').style.left=(x2-42)+'px'; $('b2').style.top=(Y-42)+'px';
  const fl=(el,tin,tout)=>{ const a=spr(t-(tin-pre),.3), b=tout?spr(t-(tout-pre),.3):ex; el.style.transform=`translateY(${((1-a)*84-b*84).toFixed(1)}px)`; el.style.opacity=(a>0.001&&b<.999)?1:0; };
  fl($('d1'),F1,M); fl($('d2'),F2,M); fl($('d3'),M+.08,null); if(mg>0.995) $('b2').style.visibility='hidden';
  place(G1,rowText(800,WD.g1)+(rowText(540,WD.g1)-rowText(800,WD.g1))*mg2,0); place(G2,rowText(280,WD.g2)+(rowText(540,WD.g2)-rowText(280,WD.g2))*mg,0);
  const xo=spr(t-(M-pre-.04),.2);
  SP.c1.concat(SP.c2).forEach(o=>wordAnim(o,t-(o.t-pre),xo,1));
  SP.cap[0].forEach(o=>wordAnim(o,t-(o.t-pre),spr(t-(C2t-pre-.1),.18),-1));
  SP.cap[1].forEach(o=>wordAnim(o,t-(o.t-pre),spr(t-(TTt-pre-.1),.18),-1));
  SP.title.forEach(o=>wordAnim(o,t-(o.t-pre),ex,-1));
  SP.chips.forEach((o,i)=>{ wordAnim(o,t-(o.t-pre),ex,-1);
    const r=o.el.getBoundingClientRect(), off=lap(t); const u=cl(spr(t-o.t,.3),0,1)*(1-ex), yy=r.bottom-4-off+ (o.el.style.transform?0:0), cx=(r.left+r.right)/2, hw=(r.width/2-14)*u;
    $('u'+(i+1)).setAttribute('d',hw>0.5?`M${cx-hw} ${yy} L${cx+hw} ${yy}`:''); });
}
// ---------- name intro: gold point -> line -> two dividers; DR. / MARWA / MAGDY revealed by masks; title under it ----------
const NM=D.N, FS=0.2, F0=0.95; let NG=null;
function nameGeo(){ const ws=[0,1,2].map(i=>$('n'+i)); ws.forEach(e=>{e.style.letterSpacing=FS+'em'; e.style.paddingLeft=FS+'em';});
  const wd=ws.map(e=>e.getBoundingClientRect().width), gp=22, tot=wd[0]+wd[1]+wd[2]+2*gp; let x=540-tot/2; const cx=[];
  wd.forEach(v=>{cx.push(x+v/2); x+=v+gp;}); return {cx,tot}; }
function nameSeek(t, ids, Tm, base, capY, opt){   // shared by the intro (under the captions) and the end card
  const g=22, Ll=64, half=NG.tot/2, ny=base;
  const ap=spr(t-(Tm.appear-pre),.22), drop=spr(t-(Tm.appear+.06),.30);
  const outer=(half+g+Ll)*spr(t-(Tm.stretch-pre),.34)*(1-spr(t-(Tm.exit+.12),.30));
  const inner=(half+g)*spr(t-(Tm.split-pre),.40)*(1-spr(t-Tm.exit,.26));
  const back=spr(t-(Tm.exit+.40),.28);
  const y=capY+(ny-capY)*drop-(ny-capY)*back;
  const dot=$(ids.dot), dotR=5*ap*(1-spr(t-(Tm.exit+.62),.2));
  dot.setAttribute('cx',540); dot.setAttribute('cy',y.toFixed(1)); dot.setAttribute('r',Math.max(0,outer<6?dotR:0).toFixed(2));
  const p=$(ids.path);
  if(outer>=6){ p.setAttribute('d', inner<1? `M${540-outer} ${y} L${540+outer} ${y}` : `M${540-outer} ${y} L${540-inner} ${y} M${540+inner} ${y} L${540+outer} ${y}`); p.style.opacity=1; } else p.style.opacity=0;
  const T=[Tm.dr,Tm.marwa,Tm.magdy];
  [0,1,2].forEach(i=>{ const e=$(ids.w+i);
    const m=cl(spr(t-(T[i]-pre),.36),0,1)*(1-cl(spr(t-(Tm.exit-.04-.06*(2-i)),.22),0,1));
    const ls=FS+(F0-FS)*(1-spr(t-(T[i]-pre),.5)); e.style.letterSpacing=ls.toFixed(3)+'em'; e.style.paddingLeft=ls.toFixed(3)+'em';
    const w=e.getBoundingClientRect().width; e.style.left=(NG.cx[i]-w/2).toFixed(1)+'px'; e.style.top=(ny-25)+'px';
    const ins=(50*(1-m)).toFixed(2); e.style.clipPath=`inset(-10px ${ins}% -10px ${ins}%)`; e.style.visibility=m<=0.001?'hidden':'visible'; });
  const e=$(ids.tt), m=cl(spr(t-(Tm.title-pre),.4),0,1)*(1-cl(spr(t-(Tm.exit-.1),.22),0,1)), w=e.getBoundingClientRect().width;
  e.style.left=(540-w/2).toFixed(1)+'px'; e.style.top=(ny+30)+'px';
  const ins=(50*(1-m)).toFixed(2); e.style.clipPath=`inset(-8px ${ins}% -8px ${ins}%)`; e.style.visibility=m<=0.001?'hidden':'visible';
}
// ---------- seek ----------
function seek(t){
  if(!WD){ WD={}; [['g1',G1],['g2',G2],['c1',C1],['c2',C2],['tt',TT]].forEach(([k,g])=>WD[k]=g.getBoundingClientRect().width);
    place(C1,rowText(540,WD.c1),0); place(C2,rowText(540,WD.c2),0); place(TT,rowText(540,WD.tt),0); place(CH,540,92); NG=nameGeo(); }
  const ly=lap(t); Lc.style.transform=`translateY(${ly.toFixed(2)}px)`;
  // captions
  blocks.forEach(B=>{ const vis=t>B.start-pre-0.02 && t<B.leave+0.4; B.el.style.visibility=vis?'visible':'hidden'; if(!vis) return;
    const xo=spr(t-(B.leave-pre),.16);
    B.c.forEach(o=>{ const a=spr(t-(o.t-pre),.30); o.el.style.transform=`translateY(${((1-a)*135-xo*135).toFixed(1)}px)`; o.el.style.opacity=(a>0.001&&xo<.999)?1:0; }); });
  splitSeek(t);
  // name intro sits under a two-row caption block (block bottom ~ +150)
  nameSeek(t,{dot:'ndot',path:'np',w:'n',tt:'ntt'},NM,190,150,{});
  // cream flash on Saber's cuts (no frame blending)
  let f=0; D.cuts.forEach(c=>{ const d=t-c; if(d>=0&&d<.5) f=Math.max(f,.30*Math.exp(-d*14)); }); $('flash').style.opacity=f.toFixed(3);
  // ending: gold ring closes on her, the world turns brown, the point becomes the dividers of the end card
  const E=D.END, cx=540, cy=820;
  const R=1500*(1-spr(t-E.start,.80));
  const vis=t>E.start-0.01; $('end').style.visibility=vis?'visible':'hidden';
  if(vis){ const r=Math.max(0,R);
    $('mask').setAttribute('d',`M0 0 H1080 V1920 H0Z M${cx} ${cy-r} a${r} ${r} 0 1 0 0.01 0Z`);
    $('ering').setAttribute('cx',cx); $('ering').setAttribute('cy',cy); $('ering').setAttribute('r',r.toFixed(1)); $('ering').style.opacity=r>2?1:0;
    const Te={appear:E.close-0.05,stretch:E.close+0.05,split:E.close+0.22,dr:E.close+0.36,marwa:E.close+0.48,magdy:E.close+0.60,title:E.close+0.80,exit:1e9};
    nameSeek(t,{dot:'edot',path:'ep',w:'e',tt:'ett'},Te,cy+40,cy,{}); }
}
window.seek=seek;
</script></body></html>
